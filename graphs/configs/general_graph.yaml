GraphConfig:
  Graph:
    Ligand:
      undirected: true # Options: [true, false]
      self_loop: false # Options: [true, false]
      graph_type: 2d   # Whether the graph is 2D or 3D
      intra_cutoff: 5.0 # Intramolecule (for 3D graphs, for 2D it is not implemented)

    Protein:
      undirected: true # Options: [true, false]
      self_loop: false # Options: [true, false]
      graph_type: 2d   # Whether the graph is 2D or 3D
      intra_cutoff: 5.0 # Intramolecule (for 3D graphs, for 2D it is not implemented)

  Interaction:
    add_interaction_edges: true # Options: [true, false]
    edge_type: true # Options: [true, false] / Adds 
    inter_cutoff: 5.0 # Intermolecule (ie between ligand and protein)