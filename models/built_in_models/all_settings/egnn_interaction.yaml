ModelSettings:
  n_rbf: 32
  hidden_dim: 64
  output_dim: 1

  ligand_mpnn: 'gin'            # ['gin', 'gcn', 'gat', 'egnn']
  ligand_mpnn_n_layers: 2

  protein_mpnn: 'gin'           # ['gin', 'gcn', 'gat', 'egnn']
  protein_mpnn_n_layers: 2

  interaction_mpnn: egnn        # ['gin', 'gcn', 'gat', 'egnn']
  interaction_mpnn_n_layers: 4

  ligand_cutoff: 3.0
  protein_cutoff: 3.0
  interaction_cutoff: 5.0

  sum_over_interaction: true